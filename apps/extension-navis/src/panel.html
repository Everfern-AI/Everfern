<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EverFern Navis</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <main class="panel-shell">
    <header class="topbar">
      <img class="brand-mark" src="logos/everfern-rounded.png" alt="EverFern" />
      <div>
        <h1>Navis</h1>
        <p>Extension-first browser control</p>
      </div>
      <span id="statusPill" class="status-pill">Waiting</span>
    </header>
    <section class="mission-card">
      <div class="orb"></div>
      <div>
        <span class="label">Current task</span>
        <strong id="taskValue">No active Navis task yet</strong>
        <p id="latestValue">Actions and thoughts will stream here.</p>
      </div>
    </section>
    <section class="page-card">
      <span class="label">Current page</span>
      <strong id="titleValue">No page captured</strong>
      <p id="urlValue">Capture a tab or start a Navis task.</p>
    </section>
    <div class="actions">
      <button id="captureBtn">Capture current page DOM</button>
      <button id="clearBtn" class="ghost">Clear feed</button>
    </div>
    <ol id="feed" class="feed"></ol>
  </main>
  <script src="panel.js"></script>
</body>
</html>
