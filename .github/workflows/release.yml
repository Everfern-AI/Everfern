name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  release:
    name: Build & Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            name: macOS-AppleSilicon
            builder_args: --mac --arm64
          - os: macos-13
            arch: x64
            name: macOS-Intel
            builder_args: --mac --x64
          - os: ubuntu-latest
            arch: x64
            name: Linux-x64
            builder_args: --linux
          - os: windows-latest
            arch: x64
            name: Windows-x64
            builder_args: --win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: brew install vips

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libvips-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libpixman-1-dev \
            libgif-dev \
            libjpeg-dev \
            libpng-dev \
            libx11-dev \
            libxtst-dev \
            libxkbfile-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            build-essential \
            python3 \
            python-is-python3 \
            make \
            g++

          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install Node Modules
        run: npm install

      # Recompiles heavy binaries safely for the matching host architecture
      - name: Compile Native Modules
        run: npm run rebuild:electron

      - name: Build Next.js frontend
        run: npm run build:next
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Compile Electron TypeScript
        run: npm run build:electron-ts

      - name: Build and Publish
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Everfern-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
