name: Build and Release

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  release:
    name: Build & Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            name: macOS-AppleSilicon
            builder_args: --mac --arm64
            rebuild_script: rebuild:electron:arm64
          - os: macos-latest
            arch: x64
            name: macOS-Intel
            builder_args: --mac --x64
            rebuild_script: rebuild:electron:x64
          - os: ubuntu-latest
            arch: x64
            name: Linux-x64
            builder_args: --linux
            rebuild_script: rebuild:electron
          - os: windows-latest
            arch: x64
            name: Windows-x64
            builder_args: --win
            rebuild_script: rebuild:electron

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Electron & builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-binaries-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-binaries-${{ runner.os }}-${{ matrix.arch }}-
            electron-binaries-${{ runner.os }}-

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libvips-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libpixman-1-dev \
            libgif-dev \
            libjpeg-dev \
            libpng-dev \
            libx11-dev \
            libxtst-dev \
            libxkbfile-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            build-essential \
            python3 \
            python-is-python3 \
            make \
            g++

          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install Node Modules
        run: npm install

      # Recompiles native modules safely for target architecture
      - name: Compile Native Modules
        run: npm run ${{ matrix.rebuild_script }}

      - name: Build Next.js frontend
        run: npm run build:next
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Compile Electron TypeScript
        run: npm run build:electron-ts

      - name: Build and Publish
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "[Attempt $i/3] Running electron-builder..."
            npx electron-builder ${{ matrix.builder_args }} --publish always && break || {
              if [ $i -lt 3 ]; then
                echo "[Warning] electron-builder encountered an error (e.g. transient 502). Retrying in 15s..."
                sleep 15
              else
                echo "[Error] electron-builder failed after 3 attempts."
                exit 1
              fi
            }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Everfern-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
