name: Build Linux

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'codenrust/**'
      - 'fix/**'
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-linux:
    name: Build Linux (AppImage · deb · rpm)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── 3. System dependencies ─────────────────────────────────────────────
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libvips-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libpixman-1-dev \
            libgif-dev \
            libjpeg-dev \
            libpng-dev \
            libx11-dev \
            libxtst-dev \
            libxkbfile-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            build-essential \
            python3 \
            python-is-python3 \
            make \
            g++

          # libfuse2 was renamed to libfuse2t64 on Ubuntu 24 — try both
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      # ── 4. Install npm dependencies ────────────────────────────────────────
      - name: Install Node modules
        run: npm install

      # ── 5. Rebuild native modules for Electron ─────────────────────────────
      - name: Rebuild native modules for Electron
        run: npm run rebuild:electron

      # ── 6. Build Next.js frontend ──────────────────────────────────────────
      - name: Build Next.js frontend
        run: npm run build:next
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # ── 7. Compile Electron TypeScript ─────────────────────────────────────
      - name: Compile Electron TypeScript
        run: npm run build:electron-ts

      # ── 8. Package with electron-builder ───────────────────────────────────
      # APPIMAGE_EXTRACT_AND_RUN=1 is required on CI runners that don't have
      # FUSE kernel support (GitHub Actions runs inside a container).
      - name: Package — AppImage, deb, rpm
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "[Attempt $i/3] Running electron-builder..."
            npx electron-builder --linux --publish never && break || {
              if [ $i -lt 3 ]; then
                echo "[Warning] electron-builder encountered an error (e.g. transient 502). Retrying in 15s..."
                sleep 15
              else
                echo "[Error] electron-builder failed after 3 attempts."
                exit 1
              fi
            }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'

      # ── 9. Upload build artifacts ──────────────────────────────────────────
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EverFern-Linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

      # ── 10. Attach to GitHub Release (tag pushes or manual trigger) ─────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
