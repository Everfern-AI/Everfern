name: Build Linux

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'codenrust/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-linux:
    name: Build Linux (AppImage · deb · rpm)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── 3. System dependencies ─────────────────────────────────────────────
      # libglib2.0-dev  → glib-object.h (required by sharp / libvips headers)
      # pkg-config      → resolves correct -I include paths for native builds
      # libvips-dev     → sharp system libvips (fallback, we use bundled below)
      # libcairo2-dev / libpango1.0-dev / librsvg2-dev → canvas module
      # libx11-dev / libxtst-dev → uiohook-napi / @jitsi/robotjs (X11 input)
      # libxkbfile-dev  → keyboard symbol lookup (robotjs)
      # libfuse2        → electron-builder AppImage packaging (Ubuntu 22)
      # libfuse2t64     → same but Ubuntu 24 renames the package
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libglib2.0-dev \
            pkg-config \
            libvips-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libpixman-1-dev \
            libgif-dev \
            libjpeg-dev \
            libpng-dev \
            libx11-dev \
            libxtst-dev \
            libxkbfile-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            build-essential \
            python3 \
            python-is-python3 \
            make \
            g++

          # libfuse2 was renamed to libfuse2t64 on Ubuntu 24 — try both
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      # ── 4. Install npm dependencies ────────────────────────────────────────
      - name: Install Node modules
        run: npm install

      # ── 5. Rebuild native modules for Electron ─────────────────────────────
      # @electron/rebuild is in devDependencies and is the correct tool for this.
      # It automatically discovers all native modules and rebuilds them against
      # the right Electron ABI headers.
      #
      # SHARP_IGNORE_GLOBAL_LIBVIPS=1 → force sharp to use its own bundled
      # libvips (inside @img/sharp-libvips-linux-x64) instead of system libvips.
      # This avoids the -I/glib-2.0 path resolution bug when building from source.
      - name: Rebuild native modules for Electron
        run: npm run rebuild:electron

      # ── 6. Build Next.js frontend ──────────────────────────────────────────
      - name: Build Next.js frontend
        run: npm run build:next
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # ── 7. Compile Electron TypeScript ─────────────────────────────────────
      - name: Compile Electron TypeScript
        run: npm run build:electron-ts

      # ── 8. Package with electron-builder ───────────────────────────────────
      # APPIMAGE_EXTRACT_AND_RUN=1 is required on CI runners that don't have
      # FUSE kernel support (GitHub Actions runs inside a container).
      - name: Package — AppImage, deb, rpm
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'

      # ── 9. Upload build artifacts ──────────────────────────────────────────
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EverFern-Linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 14

      # ── 10. Attach to GitHub Release (tag pushes or manual trigger) ─────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
