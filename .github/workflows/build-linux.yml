name: Build Linux

on:
  # Run on pushes to main or feature branches
  push:
    branches:
      - main
      - 'codenrust/**'
    # Also run on version tags → attaches artifacts to GitHub Releases
    tags:
      - 'v*'
  # Allow manual triggers from the Actions tab
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-linux:
    name: Build Linux (AppImage · deb · rpm)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── 3. System dependencies for native modules ──────────────────────────
      # sharp  → libvips
      # canvas → cairo, pango, librsvg
      # uiohook-napi / robotjs → libxtst, libx11 (X11 input hooks)
      # screenshot-desktop (legacy, still in node_modules) → xwd via xdotool
      # electron-builder AppImage → fuse
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libvips-dev \
            libcairo2-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libpixman-1-dev \
            libgif-dev \
            libjpeg-dev \
            libpng-dev \
            libx11-dev \
            libxtst-dev \
            libxkbfile-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxss-dev \
            xdotool \
            fuse \
            libfuse2 \
            python3 \
            python3-pip \
            build-essential \
            gcc \
            g++ \
            make

      # ── 4. Install npm dependencies ────────────────────────────────────────
      - name: Install Node modules
        run: npm install
        working-directory: apps/desktop

      # ── 5. Rebuild native modules against the correct Electron ABI ────────
      # We resolve the Electron version dynamically so this never drifts.
      # On Linux we use bash $() subshell — safe since we're always on ubuntu-latest.
      - name: Rebuild native modules for Electron
        working-directory: apps/desktop
        env:
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
        run: |
          ELECTRON_VERSION=$(node -e "process.stdout.write(require('./node_modules/electron/package.json').version)")
          echo "Rebuilding for Electron $ELECTRON_VERSION"
          npm_config_target=$ELECTRON_VERSION npm rebuild \
            better-sqlite3 \
            sqlite-vec \
            uiohook-napi \
            @jitsi/robotjs \
            sharp \
            canvas \
            --build-from-source

      # ── 6. Build Next.js frontend ──────────────────────────────────────────
      - name: Build Next.js frontend
        working-directory: apps/desktop
        run: npm run build:next
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # ── 7. Compile Electron TypeScript ─────────────────────────────────────
      - name: Compile Electron TypeScript
        working-directory: apps/desktop
        run: npm run build:electron-ts

      # ── 8. Package with electron-builder ──────────────────────────────────
      - name: Package — AppImage, deb, rpm
        working-directory: apps/desktop
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for AppImage builds on CI
          APPIMAGE_EXTRACT_AND_RUN: 1

      # ── 9. Upload build artifacts ──────────────────────────────────────────
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EverFern-Linux-${{ github.sha }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
          retention-days: 14

      # ── 10. Attach to GitHub Release (tag pushes only) ─────────────────────
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
