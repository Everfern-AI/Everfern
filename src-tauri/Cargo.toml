[package]
name = "everfern"
version = "2.0.2"
description = "EverFern desktop (Tauri shell)"
edition = "2021"
publish = false

[[bin]]
name = "everfern"
path = "src/main.rs"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["process", "time", "sync", "net", "rt-multi-thread"] }
http = "1"
rmcp = { version = "3.11", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
tempfile = "3"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
png = "0.18"
rusqlite = { version = "0.37", features = ["bundled", "load_extension"] }
chrono = "0.4"
quick-xml = "0.42"
regex = "1"
# fd's own walker and glob matcher, so the find tool keeps fd's rules.
ignore = "0.4"
globset = "0.4"
# Pure-Rust ONNX runtime for the local MiniLM embedding fallback (no DLL to ship).
tract-onnx = "0.23"
unicode-normalization = "0.1"
url = "2"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading"] }
# Same versions wry already uses, so nothing new is compiled in.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Embedded frontend assets can create very large debug symbol files on Windows.
[profile.dev.package.everfern]
debug = 0
